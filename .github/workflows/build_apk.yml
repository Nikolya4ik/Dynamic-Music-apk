name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev build-essential

      - name: Install buildozer
        run: pip install buildozer cython==0.29.36

      - name: Locate project files
        run: |
          if [ -f android_apk/main.py ]; then
            PROJECT_DIR=android_apk
          elif [ -f main.py ]; then
            PROJECT_DIR=.
          else
            echo "::error::Не найден main.py ни в корне, ни в папке android_apk"
            exit 1
          fi
          if [ ! -f "$PROJECT_DIR/buildozer.spec" ]; then
            if [ -f buildozer.spec ]; then
              cp buildozer.spec "$PROJECT_DIR/"
            else
              echo "::error::Не найден buildozer.spec"
              exit 1
            fi
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Проект найден в: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          yes | buildozer android debug || buildozer android debug

      - name: Find APK
        id: apk
        run: |
          APK=$(find . -name '*.apk' -not -path './.*' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::APK не собрался — смотри логи шага Build APK"
            exit 1
          fi
          echo "Найден APK: $APK"
          echo "path=$APK" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: layered-player-apk
          path: ${{ steps.apk.outputs.path }}

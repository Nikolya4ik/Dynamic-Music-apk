name: Build Android APK

# Собирает APK автоматически на серверах GitHub.
# Запуск: вкладка Actions -> Build Android APK -> Run workflow
# Готовый APK появится в разделе Artifacts этой сборки.

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev build-essential

      - name: Install buildozer
        run: pip install buildozer cython==0.29.36

      - name: Build APK
        working-directory: android_apk
        run: |
          yes | buildozer android debug || buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: layered-player-apk
          path: android_apk/bin/*.apk
